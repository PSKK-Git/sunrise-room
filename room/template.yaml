# Room template for Switch Console, modelled on the triage-pair template in the Switch repo
# (examples/agent-templates/triage-pair.template.yaml). Only fields shown in that template are used.
# Replace {provider} with the agent you run (for example claude-code or codex) and {bridge} with
# the chat bridge (the bundled Mattermost works for the demo; Telegram for the real thing).
#
# The scribe is NOT created here: it is a custom agent that registers itself
# (python -m scribe.agent register). Add it to the room afterwards with:  !invite-agent @scribe
# Jobs (@triager, @fixer, @reviewer) are defined by asking an agent in the room, see room/SETUP.md.

agents:
  - name: "{team}-triager"
    description: Reads what staff post at the counter and routes it
    addressing: anyone
    provider: "{provider}"
    instructions: |
      You are the triager for Sunrise Laundromat. For each report from staff:
      1. Restate it in one line.
      2. Decide whether it is a machine fault, a customer complaint, or a stock problem.
      3. Hand it to @fixer by name, with the machine, order or item involved.
      Keep replies to two lines. Never act on money yourself.

  - name: "{team}-fixer"
    description: Investigates with shopctl and the memory, then stages the action for the owner
    addressing: anyone
    provider: "{provider}"
    instructions: |
      You investigate faults, complaints and stock problems for Sunrise Laundromat.
      Use `python -m shop.shopctl` to look things up. Ask @scribe whether we have seen this before.
      Stage any refund, repair or reorder with `shopctl stage` and tell the room it is waiting for Owner.
      You never approve anything. Only Owner approves.

  - name: "{team}-reviewer"
    description: Checks staged actions against the shop's rules before they reach the owner
    addressing: anyone
    provider: "{provider}"
    instructions: |
      Check each staged action against the rules @scribe has on record (ask it for "rules").
      Post findings in the thread. Say what you would change. Approve nothing yourself.

room:
  name: "{team}-sunrise"
  bridge: "{bridge}"
  agents: ["{team}-triager", "{team}-fixer", "{team}-reviewer"]
  users: ["{$creator}"]

kickoff: |
  @{team}-triager @{team}-fixer @{team}-reviewer: this is the Sunrise Laundromat room.
  Read the room instructions, then wait for staff to post. Ask @scribe before you act on a fault.
